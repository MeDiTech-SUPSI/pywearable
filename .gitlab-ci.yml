stages:
  - docs
  - deploy

image: python:3.10-alpine

pages:
  stage: docs
  script:
  - pip install -U sphinx==6.2.1
  - pip install furo
  - pip install sphinx-automodapi
  - pip install .[dev]
  - sphinx-build -b html docs/ public
  artifacts:
    paths:
    - public
  only:
  - main

