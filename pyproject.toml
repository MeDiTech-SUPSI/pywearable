[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pywearable"
version = "0.1.0"
description = "A package to parse, analyse, and visualize wearable data."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">= 3.10"
dependencies = [
    "numpy",
    "pandas>=2.0",
    "matplotlib",
    "scipy",
    "python-dateutil",
    "duckdb",
]
authors = [
    { name = "Davide Marzorati", email = "davide.marzorati@supsi.ch" },
    { name = "Alvise Dei Rossi", email = "alvise.deirossi@supsi.ch" },
]

[project.urls]
Homepage = "https://github.com/MeDiTech-SUPSI/pywearable/"
Documentation = "https://pywearable.readthedocs.io/en/latest/"
Repository = "https://github.com/MeDiTech-SUPSI/pywearable/"
"Bug Tracker" = "https://github.com/MeDiTech-SUPSI/pywearable/issues"

[project.optional-dependencies]
parquet = ["pyarrow"]
neurokit = ["neurokit2"]
dev = [
    "freezegun",
    "pytest",
    "pytest-mock",
    "sphinx",
    "sphinx-rtd-theme",
    "nbsphinx",
    "pypandoc-binary",
    "pyarrow",
]

[tool.setuptools.packages.find]
where = ["src"] # ["."]

[project.scripts]
pywearable = "pywearable.cli.cli:cli"
